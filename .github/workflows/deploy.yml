name: Deploiement

# Chaque envoi sur main construit les images, les publie sur GHCR et deploie le serveur de
# demonstration (https://sante.51-210-108-173.sslip.io). Jamais sur une pull request : le depot
# est public, les secrets de deploiement ne sortent que pour un envoi sur main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Chaque envoi a son groupe : il n'attend pas le precedent. Les deploiements restent un par un
# (groupe deploy-demo) et seul le dernier commit de main part.
concurrency:
  group: deploiement-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_BASE: ghcr.io/richard6141/beninhealth

jobs:
  verifications:
    name: Types et tests unitaires
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx vitest run

  images:
    name: Images Docker (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Application
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.IMAGE_BASE }}/app:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Outils (migrations, seed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: true
          tags: ${{ env.IMAGE_BASE }}/tools:${{ github.sha }}
          cache-from: |
            type=gha,scope=app
            type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools

  # Deploiement par SSH : la cle dediee ne peut lancer que /opt/beninhealth/deploy.sh (commande
  # forcee). Le jeton GHCR ephemere du job passe par l'entree standard, jamais en argument.
  # deploy.sh sauvegarde la base, applique les migrations et revient seul a l'image precedente si
  # la sante echoue.
  deploy:
    name: Deploiement de demonstration
    runs-on: ubuntu-latest
    needs: [images]
    timeout-minutes: 20
    environment:
      name: demo
      url: https://sante.51-210-108-173.sslip.io
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      # Un envoi plus recent sur main a pu arriver pendant la construction : il se deploiera
      # lui-meme, et ce commit depasse ne doit pas passer apres lui.
      - name: Ne deployer que le dernier commit de main
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "Commit depasse par $head : le deploiement revient a l'envoi suivant."
          fi
      - name: Deployer sur le serveur de demonstration
        if: steps.head.outputs.latest == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.BH_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.BH_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.BH_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.BH_DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy ${{ github.sha }} ${{ github.repository_owner }}"
      - name: Verifier l'adresse publique
        if: steps.head.outputs.latest == 'true'
        run: curl -fsS --retry 5 --retry-delay 10 https://sante.51-210-108-173.sslip.io/api/sante

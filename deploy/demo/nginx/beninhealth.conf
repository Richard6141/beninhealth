# Site BeninHealth du serveur de démonstration, copié dans /etc/nginx/conf.d/beninhealth.conf.
# Même forme que les autres sites ajoutés à la main sur ce serveur : il ne revendique que son
# propre nom, le refus des noms inconnus (00-refus-domaines-inconnus) reste inchangé. Certificat
# Let's Encrypt émis et renouvelé par acme.sh (root), qui recharge nginx.
server {
    listen 51.210.108.173:80;
    server_name sante.51-210-108-173.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/beninhealth-acme;
        default_type "text/plain";
        allow all;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 51.210.108.173:443 ssl;
    server_name sante.51-210-108-173.sslip.io;
    ssl_certificate     /etc/nginx/beninhealth/beninhealth.crt;
    ssl_certificate_key /etc/nginx/beninhealth/beninhealth.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Téléversements de 4 Mo au plus (avatars, documents), avec une marge.
    client_max_body_size 5m;

    # Application arrêtée ou en cours de démarrage (déploiement) : une page d'attente plutôt qu'une
    # erreur de passerelle. Les réponses de l'application elle-même passent telles quelles.
    error_page 502 504 = @demarrage;
    location @demarrage {
        default_type "text/html; charset=utf-8";
        add_header Retry-After 120 always;
        return 503 '<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BeninHealth</title></head><body style="font-family:system-ui,sans-serif;max-width:36rem;margin:4rem auto;padding:0 1rem;color:#0b2545"><h1>BeninHealth démarre</h1><p>La plateforme se met à jour. Revenez dans quelques minutes.</p></body></html>';
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Première étape de l'installation : le seul port 80, pour que Let's Encrypt vérifie le nom avant
# l'émission du certificat. Remplacé ensuite par beninhealth.conf.
# Copié dans /etc/nginx/conf.d/beninhealth.conf ; ne revendique que le nom de BeninHealth.
server {
    listen 51.210.108.173:80;
    server_name sante.51-210-108-173.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/beninhealth-acme;
        default_type "text/plain";
        allow all;
    }
    location / { return 404; }
}
